# Terminates TLS for the local dev stack and forwards to Jenkins over plain
# HTTP inside the compose network. The certificate it serves comes from
# `go run ./dev/certs`, so the stack mirrors a company Jenkins fronted by an
# internal CA rather than one trusted by default.

upstream jenkins {
    server jenkins-lts:8080;
    keepalive 16;
}

server {
    listen              8443 ssl;
    http2               on;
    server_name         localhost jenkins.local;

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Jenkins streams console output; buffering would stall the log view.
    proxy_buffering     off;
    client_max_body_size 64m;

    location / {
        proxy_pass         http://jenkins;
        proxy_http_version 1.1;

        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8443;

        proxy_read_timeout 300s;
        proxy_redirect     http://$host:8080 https://$host:8443;
    }
}
